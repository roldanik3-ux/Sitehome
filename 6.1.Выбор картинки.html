<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Увеличиваем рисунки</title>
<style>
.bas {position: relative; width: 1000px; margin: auto;}
.im {position: absolute; width: 300px;
 border: 1px solid #000000; z-index: 1;}
#i1 {left: 10px; top: 10px;}
#i2 {left: 322px; top: 10px;}
#i3 {left: 634px; top: 10px;}
#i4 {left: 10px; top: 200px;}
#i5 {left: 322px; top: 200px;}
#i6 {left: 634px; top: 200px;}
</style>
<script>
let y=1;
let w=0;
let h=0;
addEventListener("click", (ev)=>
{
let e=ev.target;
if(e.tagName=="IMG")
 {
 let t=document.getElementById(e.id).style;
 if(y==1)
 { let d=document.getElementById(e.id);
 w=d.offsetLeft;
 h=d.offsetTop;
 y=2;
 for(let i=1; i<7; i++)
 {
 let b="i"+i;
 if(e.id!=b)
 {
 let p=document.getElementById(b).style;
 p.transition="opacity 1s";
 p.opacity=0;
 }
 }
 t.zIndex=2;
 t.transition="width 1s, left 1s, top 1s";
 t.width=600+"px";
 t.left=200+"px";
 t.top=100+"px";
 }
 else
 {
 y=1;
 for(let i=1; i<7; i++)
 {
 let b="i"+i;
 let p=document.getElementById(b).style;
 p.transition="opacity 2s";
 p.opacity=1;
 }
 t.transition="width 1s, left 1s, top 1s";
 t.width=300+"px";
 t.left=w+"px";
 t.top=h+"px";
 t.zIndex=1;
 }
 }
});
</script>
</head>
<body>
<div class="bas">
<img id="i1" class="im" src="0f8969336465d234c35790ac7b5d2131.jpg" alt="Фото">
<img id="i2" class="im" src="13e7ae214de908019712199980a33f3b.jpg" alt="Фото">
<img id="i3" class="im" src="d680484ddab8c657fea0b3297eefa844.jpg" alt="Фото">
<img id="i4" class="im" src="111d6fb6a8600774ce7dd0dc04a53c25.jpg" alt="Фото">
<img id="i5" class="im" src="0442227c10c9117113ff3c1c8c3c028b.jpg" alt="Фото">
<img id="i6" class="im" src="ff16aa2897cf8742ca428a08b4b74fe7.jpg" alt="Фото">
