<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Светофоры</title>
    <style>
        body {
            display: flex;
            justify-content: space-around;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .traffic-light {
            border: 3px solid black;
            padding: 10px;
            width: 60px;
            background: #333;
        }
        .light {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 10px auto;
            background: #555;
        }
        .red.active { background: red; }
        .yellow.active { background: yellow; }
        .green.active { background: green; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Автоматический светофор -->
    <div>
        <h3>Автоматический</h3>
        <div class="traffic-light">
            <div class="light red" id="a1"></div>
            <div class="light yellow" id="a2"></div>
            <div class="light green" id="a3"></div>
        </div>
    </div>

    <!-- Светофор с кнопкой -->
    <div>
        <h3>С кнопкой</h3>
        <div class="traffic-light">
            <div class="light red" id="m1"></div>
            <div class="light yellow" id="m2"></div>
            <div class="light green" id="m3"></div>
        </div>
        <button onclick="start()">Запустить</button>
    </div>

    <script>
        // Функция для переключения ламп
        function setLight(prefix, color) {
            document.getElementById(prefix + '1').className = 'light red' + (color === 'red' ? ' active' : '');
            document.getElementById(prefix + '2').className = 'light yellow' + (color === 'yellow' ? ' active' : '');
            document.getElementById(prefix + '3').className = 'light green' + (color === 'green' ? ' active' : '');
        }

        // Автоматический светофор
        let autoStep = 0;
        function autoCycle() {
            const colors = ['red', 'green', 'yellow'];
            setLight('a', colors[autoStep]);
            autoStep = (autoStep + 1) % 3;
            setTimeout(autoCycle, colors[autoStep] === 'yellow' ? 2000 : 5000);
        }
        autoCycle();

        // Светофор с кнопкой
        function start() {
            let step = 0;
            const colors = ['red', 'green', 'yellow'];
            
            function cycle() {
                setLight('m', colors[step]);
                step = (step + 1) % 3;
                setTimeout(cycle, colors[step] === 'yellow' ? 2000 : 5000);
            }
            cycle();
        }
    </script>
</body>
</html>
