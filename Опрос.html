<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Простая анкета</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; }
      label { display: block; margin-top: 10px; font-weight: bold; }
      input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; }
      .group { margin-top: 5px; }
      button { margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
      #output { margin-top: 25px; padding: 15px; background: #f0f0f0; border-radius: 5px; display: none; }
    </style>
  </head>
  <body>

    <h2>Анкета</h2>

    <form id="myForm">
      <label>Имя:</label>
      <input type="text" id="name" placeholder="Ваше имя">

      <label>Пол:</label>
      <div class="group">
        <input type="radio" name="gender" value="женский" checked> женский
        <input type="radio" name="gender" value="мужской"> мужской
      </div>

      <label>Курс:</label>
      <select id="course">
        <option value="первый">первый</option>
        <option value="второй">второй</option>
        <option value="третий">третий</option>
        <option value="четвёртый">четвёртый</option>
        <option value="пятый">пятый</option>
      </select>

      <label>Языки программирования:</label>
      <div class="group">
        <input type="checkbox" id="lang1" value="Паскаль"> Паскаль
        <input type="checkbox" id="lang2" value="С++"> С++
        <input type="checkbox" id="lang3" value="Ассемблер"> Ассемблер
      </div>

      <label>О себе:</label>
      <textarea id="about" rows="3" placeholder="Немного о себе"></textarea>

      <button type="submit">Показать данные</button>
    </form>

    <div id="output"></div>

    <script>
      document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault(); // останавливаем перезагрузку страницы

        // --- Переменные для данных ---
        const name = document.getElementById('name').value;
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const course = document.getElementById('course').value;
        const about = document.getElementById('about').value || 'не указано';

        // Собираем языки в переменную-массив
        const languages = [];
        if (document.getElementById('lang1').checked) languages.push('Паскаль');
        if (document.getElementById('lang2').checked) languages.push('С++');
        if (document.getElementById('lang3').checked) languages.push('Ассемблер');

        const langText = languages.length ? languages.join(', ') : 'не указаны';

        // --- Вывод через переменную ---
        const outputDiv = document.getElementById('output');
        outputDiv.style.display = 'block';
        outputDiv.innerHTML = `
          <h3>Ваши данные:</h3>
          <p><strong>Имя:</strong> ${name}</p>
          <p><strong>Пол:</strong> ${gender}</p>
          <p><strong>Курс:</strong> ${course}</p>
          <p><strong>Языки:</strong> ${langText}</p>
          <p><strong>О себе:</strong> ${about}</p>
        `;
      });
    </script>
  </body>
</html>
